<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>API 使用 demo</title><meta content="0.1.3" name="application-version"><script>
(function(){
  // 旧 WebView 兼容：ES2022/2023 新方法 polyfill
  try{
    if(!Array.prototype.toSorted)Array.prototype.toSorted=function(c){return this.slice().sort(c);};
    if(!Array.prototype.toReversed)Array.prototype.toReversed=function(){return this.slice().reverse();};
    if(!Array.prototype.toSpliced)Array.prototype.toSpliced=function(){var a=this.slice();return a.splice.apply(a,arguments),a;};
    if(!Array.prototype.with)Array.prototype.with=function(i,v){var a=this.slice();a[i<0?a.length+i:i]=v;return a;};
    if(!Array.prototype.at)Array.prototype.at=function(i){i=i||0;return i<0?this[this.length+i]:this[i];};
    if(!Array.prototype.findLast)Array.prototype.findLast=function(f){for(var i=this.length-1;i>=0;i--)if(f(this[i],i,this))return this[i];};
    if(!Array.prototype.findLastIndex)Array.prototype.findLastIndex=function(f){for(var i=this.length-1;i>=0;i--)if(f(this[i],i,this))return i;return -1;};
    if(!Object.hasOwn)Object.hasOwn=function(o,k){return Object.prototype.hasOwnProperty.call(o,k);};
    if(!Object.groupBy)Object.groupBy=function(a,f){var o=Object.create(null);a.forEach(function(x){var k=f(x);(o[k]||(o[k]=[])).push(x);});return o;};
    if(typeof CSS==='undefined')window.CSS={};
    if(!CSS.escape)CSS.escape=function(s){return String(s).replace(/([^a-zA-Z0-9_-])/g,'\\$1');};
    // 老 WebView 的 HTMLImageElement.decode() 会永久 pending，
    // 导致读取图片尺寸（含续聊时的历史附件检查）卡住。改为立即 resolve。
    if(typeof HTMLImageElement!=='undefined'){
      HTMLImageElement.prototype.decode=function(){ return Promise.resolve(); };
    }
  }catch(e){}
  // dvh -> vh：旧 WebView 不认 dvh，主框架高度塌成 0 导致白屏
  try{
    var s=document.createElement('style');
    s.textContent=':root{--app-viewport-height:100vh!important;--app-viewport-top:0px!important}html,body{height:100%!important;margin:0!important}#root{height:100vh!important;min-height:100vh!important}#root>div{height:100vh!important;min-height:100vh!important}[class*=frame-]{height:100vh!important}';
    (document.head||document.documentElement).appendChild(s);
  }catch(e){}
})();
</script>
<script>
(function(){
  if(window.__dsUploadBridge) return;
  window.__dsUploadBridge = true;
  function log(s){ try{ if(window.DSNative && window.DSNative.log) window.DSNative.log('[upl] '+s); }catch(e){} }

  var nativeFetch = window.fetch;
  if(!nativeFetch) return;

  function toB64(blob){
    return new Promise(function(resolve,reject){
      var fr = new FileReader();
      fr.onload = function(){
        try{
          var s = String(fr.result);
          var comma = s.indexOf(',');
          resolve(comma>=0 ? s.substring(comma+1) : s);
        }catch(e){ reject(e); }
      };
      fr.onerror = function(){ reject(new Error('read file failed')); };
      try{ fr.readAsDataURL(blob); }catch(e){ reject(e); }
    });
  }

  // 把原生返回的 JSON 字符串包装成 fetch Response 风格对象
  function wrapResponse(jsonText, ok, status){
    return {
      ok: ok,
      status: status || (ok?200:400),
      statusText: ok?'OK':'Bad Request',
      json: function(){ return Promise.resolve(JSON.parse(jsonText)); },
      text: function(){ return Promise.resolve(jsonText); }
    };
  }

  // 老 WebView 的 fetch 上传 FormData 有兼容问题：
  // 把发往 /files 和 /asr 的 multipart 上传交给 Android 原生 HttpURLConnection。
  window.fetch = function(input, init){
    var url = '', opt = init || {}, req = null;
    if(input && typeof input==='object' && input.url){
      url = input.url; req = input;
    } else {
      url = typeof input==='string' ? input : (input && input.url) || '';
    }
    var isFiles = url.indexOf('/anthropic/v1/files')>=0 || url.indexOf('/files')>=0;
    var isAsr = url.indexOf('/tools/asr')>=0 || url.indexOf('/asr')>=0;
    if(isFiles || isAsr){
      try{
        var body0 = opt.body || null;
        var f0 = body0 && body0.get ? body0.get('file') : null;
        if(window.DSNative && window.DSNative.toast)
          window.DSNative.toast('拦到上传 '+(isAsr?'ASR':'files')+' file='+(f0?(f0.name||'?')+'/'+(f0.size||0):'无'));
      }catch(e){}
      try{
        var body = opt.body || null;
        var method = (opt.method || (req && req.method) || 'GET').toUpperCase();
        // 情况A：(url, {body: FormData})
        if(body && typeof FormData!=='undefined' && (body instanceof FormData || (body.get && body.append))){
          var headers = opt.headers || (req && req.headers) || {};
          var hval = function(name){
            try{
              if(headers.get) return headers.get(name) || '';
              for(var k in headers){ if(String(k).toLowerCase()===name.toLowerCase()) return headers[k]; }
            }catch(e){}
            return '';
          };
          var apiKey = hval('x-api-key');
          var auth = hval('Authorization');
          var authKind = 'apikey';
          if(!apiKey && auth){ apiKey = String(auth).replace(/^Bearer\s+/i,''); authKind='bearer'; }
          var file = body.get ? body.get('file') : null;
          var purpose = body.get ? body.get('purpose') : null;
          var name = (file && file.name) || 'upload';
          var type = (file && file.type) || 'application/octet-stream';
          if(!file) return nativeFetch.apply(this, arguments);
          return toB64(file).then(function(b64){
            return new Promise(function(resolve,reject){
              var id='up_'+Date.now()+'_'+Math.random().toString(36).slice(2);
              window.__dsUploadCbs=window.__dsUploadCbs||{};
              window.__dsUploadCbs[id]=function(json,ok){
                try{resolve(wrapResponse(json,ok!==false,ok===false?400:200));}catch(e){reject(e);}
              };
              try{ window.DSNative.uploadFile(id,apiKey,b64,name,type,purpose||'',authKind,isAsr?'asr':'files'); }
              catch(e){ reject(e); }
            });
          }).catch(function(e){ log('A ERR '+e.message); throw e; });
        }
        // 情况B：Request 对象携带 FormData
        if(req && req.clone){
          try{
            return req.clone().formData().then(function(fd){
              var headers = req.headers || {};
              var hv = function(n){ try{return headers.get?headers.get(n)||'':'';}catch(e){return '';} };
              var apiKey = hv('x-api-key');
              var auth = hv('Authorization');
              var authKind = 'apikey';
              if(!apiKey && auth){ apiKey = String(auth).replace(/^Bearer\s+/i,''); authKind='bearer'; }
              var file = fd.get('file');
              var purpose = fd.get('purpose');
              if(!file) return nativeFetch.apply(window,arguments);
              var name = (file && file.name) || 'upload';
              var type = (file && file.type) || 'application/octet-stream';
              return toB64(file).then(function(b64){
                return new Promise(function(resolve,reject){
                  var id='up_'+Date.now()+'_'+Math.random().toString(36).slice(2);
                  window.__dsUploadCbs=window.__dsUploadCbs||{};
                  window.__dsUploadCbs[id]=function(json,ok){
                    try{resolve(wrapResponse(json,ok!==false,ok===false?400:200));}catch(e){reject(e);}
                  };
                  try{ window.DSNative.uploadFile(id,apiKey,b64,name,type,purpose||'',authKind,isAsr?'asr':'files'); }
                  catch(e){ reject(e); }
                });
              });
            }).catch(function(e){ return nativeFetch.apply(window,arguments); });
          }catch(e){}
        }
      }catch(e){ log('detect ERR '+e.message); }
    }
    return nativeFetch.apply(this, arguments);
  };

  // 原生回调入口
  window.DSUploadDone = function(id, json, ok){
    try{
      var cb = window.__dsUploadCbs && window.__dsUploadCbs[id];
      if(cb){ delete window.__dsUploadCbs[id]; cb(json, ok); }
    }catch(e){}
  };

  // 续聊重传附件专用：绕过网页 fetch，直接走原生桥上传，返回 serverId。
  window.__dsUploadAttachment = function(apiKey, blob, name, isImage, purpose){
    log('__dsUploadAttachment 调用 name='+name+' blobSize='+(blob&&blob.size)+' isImage='+isImage+' key='+(apiKey?apiKey.slice(0,6):'空'));
    if(!blob){ log('__dsUploadAttachment blob为空，直接失败'); return Promise.reject(new Error('empty blob')); }
    return toB64(blob).then(function(b64){
      log('__dsUploadAttachment b64完成 len='+b64.length);
      return new Promise(function(resolve, reject){
        var id='up_'+Date.now()+'_'+Math.random().toString(36).slice(2);
        window.__dsUploadCbs=window.__dsUploadCbs||{};
        window.__dsUploadCbs[id]=function(json, ok){
          log('__dsUploadAttachment 回调 ok='+ok+' json='+String(json).slice(0,200));
          try{
            if(ok===false){ reject(new Error('upload failed')); return; }
            var obj = (typeof json==='string') ? JSON.parse(json) : json;
            var sid = obj && (obj.id || (obj.file&&obj.file.id));
            if(sid){ log('__dsUploadAttachment 成功 sid='+sid); resolve(sid); }
            else { log('__dsUploadAttachment 无file id'); reject(new Error('no file id')); }
          }catch(e){ reject(e); }
        };
        var type = blob && blob.type || (isImage?'image/jpeg':'application/octet-stream');
        try{ window.DSNative.uploadFile(id, apiKey, b64, name||'upload', type, purpose||'', 'apikey', 'files'); log('__dsUploadAttachment 已调原生'); }
        catch(e){ log('__dsUploadAttachment 调原生异常 '+e.message); reject(e); }
      });
    });
  };
  log('bridge installed');
})();
</script>
<script>
// ===== 运行监控：捕获所有 console/错误 + 导出日志按钮 =====
(function(){
  function J(msg){ try{ if(window.DSNative&&window.DSNative.log) window.DSNative.log('[MON] '+msg); }catch(e){} }
  J('监控启动');
  // console 全捕获
  ['log','warn','error','info'].forEach(function(k){
    var orig=console[k];
    if(typeof orig!=='function')return;
    console[k]=function(){
      try{ var a=Array.prototype.map.call(arguments,function(x){return typeof x==='object'?JSON.stringify(x):String(x)}).join(' '); J('console.'+k+': '+a.slice(0,300)); }catch(e){}
      return orig.apply(console,arguments);
    };
  });
  // 未捕获异常/Promise错误
  window.addEventListener('error',function(ev){ J('JS错误 '+String(ev.message).slice(0,150)+' @'+(ev.filename||'').split('/').pop()+':'+ev.lineno); });
  window.addEventListener('unhandledrejection',function(ev){ J('Promise拒绝 '+String(ev.reason&&ev.reason.message||ev.reason).slice(0,200)); });
  // 浮动的"导出日志"按钮
  function addBtn(){
    try{
      if(document.getElementById('__dsLogBtn'))return;
      var b=document.createElement('button');
      b.id='__dsLogBtn';
      b.textContent='日志';
      b.style.cssText='position:fixed;left:8px;top:50%;transform:translateY(-50%);z-index:99999;width:44px;height:44px;border-radius:22px;border:none;background:rgba(0,120,255,.75);color:#fff;font-size:13px;opacity:.7';
      b.onclick=function(e){
        e.stopPropagation();
        // 快照：扫描页面上"上传失败/上传中"的附件元素
        try{
          var nodes=document.querySelectorAll('*'), cnt=0;
          for(var i=0;i<nodes.length && cnt<20;i++){
            var el=nodes[i];
            if(el.children.length) continue; // 只看叶子文本节点
            var tx=(el.textContent||'').trim();
            if(tx.indexOf('上传失败')>=0 || tx.indexOf('上传中')>=0){
              var par=el.parentElement, title=par?(par.getAttribute('title')||par.getAttribute('aria-label')||''):'';
              J('页面附件状态 "'+tx.slice(0,20)+'" title='+String(title).slice(0,40));
              cnt++;
            }
          }
          J('快照完成 匹配'+cnt+'个');
        }catch(e){ J('快照异常 '+e.message); }
        try{window.DSNative.exportLog()}catch(err){alert('导出失败:'+err.message)}
      };
      (document.body||document.documentElement).appendChild(b);
      J('日志按钮已添加');
    }catch(e){ J('按钮添加失败 '+e.message); }
  }
  if(document.body) addBtn(); else document.addEventListener('DOMContentLoaded',addBtn);
  setTimeout(addBtn,1500);
})();
</script>
